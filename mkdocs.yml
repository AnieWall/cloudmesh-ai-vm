site_name: cloudmesh-ai-vm
site_url: https://cloudmesh-ai.github.io/cloudmesh-ai-vm
site_description: A unified VM management tool across local and cloud providers.
repo_url: https://github.com/cloudmesh-ai/cloudmesh-ai-vm
repo_name: cloudmesh-ai-vm

docs_dir: docs
use_directory_urls: false

extra_css:
  - css/custom.css

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Cheatsheet: cheatsheet.md
  - Manual:
    - Overview: manual.md
    - VM Status: vm_status.md
    - VM Purge: vm_purge.md
    - All Commands: manual_commands.md
    - Commands:
        - Config: command_pages/config.md
        - Start: command_pages/start.md
        - Stop: command_pages/stop.md
        - Restart: command_pages/restart.md
        - Suspend: command_pages/suspend.md
        - Shelve: command_pages/shelve.md
        - Unshelve: command_pages/unshelve.md
        - Delete: command_pages/delete.md
        - Reset: command_pages/reset.md
        - List: command_pages/list.md
        - Info: command_pages/info.md
        - Image: command_pages/image.md
        - Flavor: command_pages/flavor.md
        - Security-Group: command_pages/security_group.md
        - Provider: command_pages/provider.md
        - Key: command_pages/key.md
        - Run: command_pages/run.md
        - SSH: command_pages/ssh.md
        - Login: command_pages/login.md
        - SSH-Config: command_pages/ssh-config.md
        - Account: command_pages/account.md
        - Horizon: command_pages/horizon.md
        - Status: command_pages/status.md
        - Purge: command_pages/purge.md
  - CLI Reference: cli.md
  - Changelog: CHANGELOG.md
  - API: api.md
  - Readme: readme.md
  - Providers:
    - Overview: providers/index.md
    - Local Providers:
      - Multipass: providers/local/multipass.md
      - Lima: providers/local/lima.md
      - WSL2: providers/local/wsl2.md
      - VirtualBox: providers/local/vbox.md
    - OpenStack Providers:
      - Overview: providers/openstack/openstack.md
      - Jetstream: providers/openstack/jetstream.md
      - Chameleon: providers/openstack/chameleon.md
      - Security: providers/openstack/security.md
    - Hyperscaler Providers:
      - AWS EC2: providers/hyperscalers/aws.md
      - Azure VMs: providers/hyperscalers/azure.md
      - Google GCE: providers/hyperscalers/google.md
  - Architecture: architecture.md
  - Plan Start2: plan-start2.md
  - Floating IP Workflow: floating-ip-workflow.md
  - Contributing: contributing.md

plugins:
  - cloudmesh-ai-theme
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: table
            docstring_style: google
            group_by_category: true
            members: true
            separate_signature: true
            show_category_heading: true
            show_root_full_path: true
            show_source: true
            show_submodules: true
          paths:
            - src

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_style: colorful
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed
  - admonition
  - pymdownx.details
